name: Tests

on:
  pull_request:
    branches: [main, develop, dependency-updates]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Volle Matrix nur am main-Gate; früh reicht eine Version.
        python-version: ${{ github.base_ref == 'main' && fromJSON('["3.10","3.11","3.12"]') || fromJSON('["3.12"]') }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck
        run: shellcheck kb-init.sh
